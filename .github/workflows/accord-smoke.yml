name: Accord live Meta inference smoke test
on:
  push:
    paths:
      - '.github/workflows/accord-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one live inference through Accord's production API
        env:
          ACCORD_URL: https://accord-evidence-hackathon.vercel.app/api/analyze
        run: |
          node - <<'NODE'
          async function main() {
            const evidence = 'On November 1, the client wrote: "We agree to launch on November 18." On November 3, the client asked: "Could we launch on November 11 instead?"';
            const response = await fetch(process.env.ACCORD_URL, {
              method: 'POST',
              headers: {'content-type':'application/json'},
              body: JSON.stringify({sourceTitle:'Demo kickoff and change request',text:evidence}),
              signal: AbortSignal.timeout(55000)
            });
            const result = await response.json().catch(()=>({error:'Invalid JSON response'}));
            console.log(JSON.stringify({status:response.status,provider:result.provider||null,model:result.model||null,candidates:Array.isArray(result.candidates)?result.candidates.length:null,error:result.error||null,discarded:result.discarded||null}));
            if (!response.ok) process.exitCode=1;
          }
          main().catch(e=>{console.error('Request failed:',e.message);process.exitCode=1});
          NODE
